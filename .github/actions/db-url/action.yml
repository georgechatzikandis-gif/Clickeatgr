name: Production database URL
description: >
  Sets DATABASE_URL for the production Supabase database. Uses the SUPABASE_DB_PASSWORD secret
  (just the password; spaces are trimmed and special characters encoded) or, as a fallback,
  the full PRODUCTION_DATABASE_URL secret.
inputs:
  password:
    description: Database password (secrets.SUPABASE_DB_PASSWORD)
    required: false
  url:
    description: Full connection string (secrets.PRODUCTION_DATABASE_URL)
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DB_PASSWORD: ${{ inputs.password }}
        DB_URL: ${{ inputs.url }}
        # Not secret: Supabase project id and the Frankfurt session pooler.
        DB_USER: postgres.nyretkhhdcpjcokcwwyk
        DB_HOST: aws-1-eu-central-1.pooler.supabase.com
      run: |
        if [ -n "$DB_PASSWORD" ]; then
          ENC=$(node -e 'process.stdout.write(encodeURIComponent(process.env.DB_PASSWORD.trim()))')
          echo "::add-mask::$ENC"
          echo "DATABASE_URL=postgresql://$DB_USER:$ENC@$DB_HOST:5432/postgres" >> "$GITHUB_ENV"
          echo "Using SUPABASE_DB_PASSWORD"
        elif [ -n "$DB_URL" ]; then
          echo "DATABASE_URL=$(echo "$DB_URL" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "Using PRODUCTION_DATABASE_URL"
        else
          echo "::error::Add the SUPABASE_DB_PASSWORD secret (Settings → Secrets and variables → Actions)"; exit 1
        fi
