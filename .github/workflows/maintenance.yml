name: Monthly data retention

# Anonymises customer details on orders older than 12 months (GDPR data minimisation).
# Required repository secret: SUPABASE_DB_PASSWORD.

on:
  schedule:
    - cron: "41 3 1 * *"
  workflow_dispatch:

jobs:
  anonymize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/db-url
        with:
          password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          url: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm data:anonymize --apply
