name: Database setup / migrate

# Run manually (Actions → "Database setup / migrate" → Run workflow) to create or update the
# production tables. Safe to run again: migrations and base data are only applied once.
# Required secret: SUPABASE_DB_PASSWORD (just the Supabase database password).
# Optional secrets, only for creating the first admin: ADMIN_EMAIL and ADMIN_INITIAL_PASSWORD.
# Optional secret TEST_SHOP_PASSWORD: password for the test shop logins (test1@clickeat.test …).

on:
  workflow_dispatch:
    inputs:
      create_admin:
        description: "Create/reset the admin account from ADMIN_EMAIL / ADMIN_INITIAL_PASSWORD"
        type: boolean
        default: false
      test_shops:
        description: "10 test shops (24/7, marked ΔΟΚΙΜΑΣΤΙΚΟ): add, remove (with their test orders), or replace"
        type: choice
        options: [none, add, remove, replace]
        default: none

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/db-url
        with:
          password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          url: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Base data (Rhodes, food categories)
        run: pnpm db:seed
      - name: Create admin
        if: ${{ inputs.create_admin }}
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CLICKEAT_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$CLICKEAT_PASSWORD" ]; then echo "::error::Set ADMIN_EMAIL and ADMIN_INITIAL_PASSWORD secrets"; exit 1; fi
          pnpm user:create admin "$ADMIN_EMAIL"
      - name: Test shops
        if: ${{ inputs.test_shops != 'none' && inputs.test_shops != '' }}
        env:
          TEST_SHOP_PASSWORD: ${{ secrets.TEST_SHOP_PASSWORD }}
          MODE: ${{ inputs.test_shops }}
        run: |
          if [ "$MODE" = "remove" ] || [ "$MODE" = "replace" ]; then pnpm db:seed:test-shops --remove; fi
          if [ "$MODE" = "add" ] || [ "$MODE" = "replace" ]; then pnpm db:seed:test-shops; fi
