name: Database setup / migrate

# Run manually (Actions → "Database setup / migrate" → Run workflow) to create or update the
# production tables. Safe to run again: migrations and base data are only applied once.
# Required secret: PRODUCTION_DATABASE_URL (Supabase *session pooler* URI, port 5432).
# Optional secrets, only for creating the first admin: ADMIN_EMAIL and ADMIN_INITIAL_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      create_admin:
        description: "Create/reset the admin account from ADMIN_EMAIL / ADMIN_INITIAL_PASSWORD"
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Check secret
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secret PRODUCTION_DATABASE_URL is missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Base data (Rhodes, food categories)
        run: pnpm db:seed
      - name: Create admin
        if: ${{ inputs.create_admin }}
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CLICKEAT_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$CLICKEAT_PASSWORD" ]; then echo "::error::Set ADMIN_EMAIL and ADMIN_INITIAL_PASSWORD secrets"; exit 1; fi
          pnpm user:create admin "$ADMIN_EMAIL"
