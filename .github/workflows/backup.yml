name: Nightly database backup

# Dumps the production database every night, encrypts it with BACKUP_PASSPHRASE and keeps it
# as a workflow artifact for 30 days. Encryption matters: artifacts must never expose customer data.
# Required repository secrets: SUPABASE_DB_PASSWORD and BACKUP_PASSPHRASE.

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC ≈ 04:17/05:17 Athens
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/db-url
        with:
          password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          url: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - name: Install pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Check secrets
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "Backup secrets are not configured yet; skipping."; echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Dump and encrypt
        if: env.SKIP != '1'
        run: |
          FILE="clickeat-$(date -u +%Y%m%d-%H%M).dump"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" > "$FILE"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "$FILE.gpg" "$FILE"
          rm "$FILE"
          ls -lh "$FILE.gpg"
          echo "BACKUP_FILE=$FILE.gpg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1'
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
