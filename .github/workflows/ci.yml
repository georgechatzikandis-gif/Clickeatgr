name: CI

on:
  push:
    branches: [main, mvp]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clickeat
          POSTGRES_PASSWORD: clickeat
          POSTGRES_DB: clickeat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clickeat" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://clickeat:clickeat@localhost:5432/clickeat_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgres://unused:unused@localhost:5432/unused
